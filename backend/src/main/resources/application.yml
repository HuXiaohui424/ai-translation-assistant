server:
  port: 8080

spring:
  application:
    name: ai-translation-assistant-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

aliyun:
  realtime:
    api-key: ${DASHSCOPE_API_KEY:}
    model: gummy-realtime-v1
    source-language: en
    target-language: zh
    sample-rate: 16000
    format: pcm
    max-end-silence: 700
