server:
  port: 8080

spring:
  application:
    name: ai-translation-assistant-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

aliyun:
  realtime:
    api-key: ${DASHSCOPE_API_KEY:}
    model: gummy-realtime-v1
    source-language: en
    target-language: zh
    sample-rate: 16000
    format: pcm
    max-end-silence: 700
    silence-boundary-ms: 700
    max-segment-duration-ms: 3000
    final-segment-revision-grace-ms: 1000
    reconnect-max-attempts: 5
    reconnect-initial-delay-ms: 1000
    reconnect-max-delay-ms: 10000
  minutes:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    max-transcript-chars: 12000
    timeout-ms: 30000
