server:
  port: 8080

spring:
  application:
    name: ai-translation-assistant-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

aliyun:
  realtime:
    api-key: ${DASHSCOPE_API_KEY:sk-c7d8993a9d17412aa19c11d5bb1a24e6}
    model: gummy-realtime-v1
    source-language: en
    target-language: zh
    sample-rate: 16000
    format: pcm
    max-end-silence: 700
    max-segment-duration-ms: 3000
    reconnect-max-attempts: 5
    reconnect-initial-delay-ms: 1000
    reconnect-max-delay-ms: 10000
